version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - NOVA_LITE_MODEL_ID=${NOVA_LITE_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
      - NOVA_EMBED_MODEL_ID=${NOVA_EMBED_MODEL_ID:-amazon.nova-2-multimodal-embeddings-v1:0}
      - NOVA_SONIC_MODEL_ID=${NOVA_SONIC_MODEL_ID:-us.amazon.nova-2-sonic-v1:0}
    command: python -m uvicorn api.server:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - NOVA_LITE_MODEL_ID=${NOVA_LITE_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
      - NOVA_EMBED_MODEL_ID=${NOVA_EMBED_MODEL_ID:-amazon.nova-2-multimodal-embeddings-v1:0}
      - NOVA_SONIC_MODEL_ID=${NOVA_SONIC_MODEL_ID:-us.amazon.nova-2-sonic-v1:0}
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - api

networks:
  default:
    name: returnshield-network
